<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS payment window</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eeec;--surface:#fff;--sunk:#f3f6f5;--ink:#15302e;--muted:#5d716e;--line:#d3dcd9;--accent:#0f766e;--accent-ink:#fff;--focus:#0f766e33;--err:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1716;--surface:#15211f;--sunk:#101a19;--ink:#e4efec;--muted:#93aaa6;--line:#28403c;--accent:#2fb5a6;--accent-ink:#04211e;--focus:#2fb5a640;--err:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0d1716;--surface:#15211f;--sunk:#101a19;--ink:#e4efec;--muted:#93aaa6;--line:#28403c;--accent:#2fb5a6;--accent-ink:#04211e;--focus:#2fb5a640;--err:#ff8a7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 "Instrument Sans",system-ui,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.dlg{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0a1f1c1f;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.bar button{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:16px}
.bar button:hover{background:var(--line)}
.due{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
.due span{color:var(--muted);font-weight:500}
.due b{font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.due small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.body{padding:16px 20px 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:8px;border-radius:6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0a1f1c30}
label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:4px}
input,select{width:100%;height:42px;padding:0 11px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;outline:0}
input.amt{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 14px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:7px;font-weight:600;font-size:13px}
.chip:hover{background:var(--sunk)}
.chg{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.chg b{font-size:22px;font-variant-numeric:tabular-nums}
.chg.short b{color:var(--err)}
.chg.good{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.term{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:var(--sunk)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.dot.wait{background:#c98a0a;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.dot.wait{animation:none}}
.foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--sunk)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;height:42px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-weight:600;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn:hover{background:var(--sunk)}
.btn.pri{flex:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.done{display:none;padding:34px 20px;text-align:center}
.done.on{display:block}
.done b{display:block;font-size:18px;margin-bottom:4px}
.done p{margin:0 0 16px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<section class="dlg" aria-label="Accept payment">
  <div class="bar"><span>Payment</span><button type="button" aria-label="Close">×</button></div>
  <div class="due"><span>Amount due</span><div><b id="due">0.00</b><small>AED</small></div></div>

  <div id="form">
    <div class="body">
      <div class="seg" role="group" aria-label="Payment method">
        <button type="button" id="mCash" aria-pressed="true">Cash</button>
        <button type="button" id="mCard" aria-pressed="false">Card</button>
      </div>

      <div id="cash">
        <label for="rec">Cash received</label>
        <input class="amt" id="rec" inputmode="decimal" autocomplete="off" placeholder="0.00">
        <div class="quick" id="quick"></div>
        <div class="chg" id="chg"><span id="chgL">Change to return</span><b id="chgV">0.00</b></div>
      </div>

      <div id="card" hidden>
        <div class="term"><span class="dot wait" id="dot"></span><div><b id="tStat">Terminal ready</b><div style="color:var(--muted);font-size:12.5px" id="tSub">Ask the customer to tap, insert or swipe.</div></div></div>
        <label for="crec">Received in card</label>
        <input class="amt" id="crec" inputmode="decimal" autocomplete="off" placeholder="0.00">
        <div class="chg" id="cchg" style="margin-top:14px"><span id="cchgL">Still to collect</span><b id="cchgV">0.00</b></div>
        <div style="margin-bottom:14px"><label for="appr">Details</label><input id="appr" autocomplete="off" placeholder="Approval code or note"></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn" type="button" id="cancel">Cancel</button>
      <button class="btn pri" type="button" id="ok" disabled>Accept cash</button>
    </div>
  </div>

  <div class="done" id="done" role="status">
    <b id="dTitle">Payment accepted</b>
    <p id="dSub"></p>
    <button class="btn pri" type="button" id="again" style="width:100%">New sale</button>
  </div>
</section>
<script>
const $=id=>document.getElementById(id);
const DUE=186.50; let method='cash';
const f=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
$('due').textContent=f(DUE);
// quick amounts: exact + next round notes
const notes=[...new Set([50,100,200,500].filter(n=>n>=DUE).concat([Math.ceil(DUE/50)*50]))].slice(0,3);
const q=[['Exact',DUE],...notes.map(n=>[String(n),n])];
while(q.length<5)q.push(['1000',1000]);
$('quick').innerHTML=q.slice(0,5).map(([l,v])=>`<button type="button" class="chip" data-v="${v}">${l}</button>`).join('');
$('quick').onclick=e=>{const v=e.target.dataset.v;if(v){$('rec').value=(+v).toFixed(2);calc()}};
function calc(){
  const r=parseFloat($('rec').value)||0,d=r-DUE,c=$('chg');
  c.classList.toggle('short',r>0&&d<0);c.classList.toggle('good',d>=0&&r>0);
  $('chgL').textContent=(r>0&&d<0)?'Still to collect':'Change to return';
  $('chgV').textContent=f(Math.abs(r>0?d:0));
  if(method==='cash')$('ok').disabled=!(d>=-0.001&&r>0);
}
function cardCheck(){
  const r=parseFloat($('crec').value)||0,d=DUE-r,c=$('cchg');
  c.classList.toggle('short',r>0&&d>0);c.classList.toggle('good',r>0&&d<=0.001);
  $('cchgL').textContent=(r>0&&d<-0.001)?'Over by':'Still to collect';
  $('cchgV').textContent=f(r>0?Math.abs(d):DUE);
  if(method==='card')$('ok').disabled=!(r>0&&d<=0.001);
}
function setM(m){method=m;$('mCash').setAttribute('aria-pressed',m==='cash');$('mCard').setAttribute('aria-pressed',m==='card');
  $('cash').hidden=m!=='cash';$('card').hidden=m!=='card';$('ok').textContent=m==='cash'?'Accept cash':'Confirm card payment';
  $('ok').disabled=true;m==='cash'?calc():cardCheck();}
$('mCash').onclick=()=>setM('cash');$('mCard').onclick=()=>setM('card');
$('rec').addEventListener('input',calc);
$('crec').addEventListener('input',cardCheck);
$('ok').onclick=()=>{
  $('form').hidden=true;$('done').classList.add('on');
  if(method==='cash'){const ch=(parseFloat($('rec').value)||0)-DUE;$('dTitle').textContent='Cash accepted';$('dSub').textContent=ch>0.001?`Return ${f(ch)} AED to the customer.`:'No change due.'}
  else{$('dTitle').textContent='Card payment recorded';const dt=$('appr').value.trim();$('dSub').textContent=`${f(parseFloat($('crec').value))} AED by card${dt?', '+dt:''}.`}
};
function reset(){$('done').classList.remove('on');$('form').hidden=false;$('rec').value='';$('crec').value='';$('appr').value='';setM('cash');calc()}
$('again').onclick=reset;$('cancel').onclick=reset;
calc();cardCheck();
</script>
</body>
</html>
